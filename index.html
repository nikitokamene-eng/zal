<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Зал">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Зал</title>
<style>
:root{
 color-scheme:light dark;
 --bg:oklch(0.972 0.005 150);--surf:oklch(1 0 0);--surf2:oklch(0.955 0.006 150);
 --ink:oklch(0.21 0.012 150);--mut:oklch(0.46 0.012 150);--line:oklch(0.9 0.007 150);
 --acc:oklch(0.53 0.15 150);--on-acc:oklch(0.99 0 0);--acc-soft:oklch(0.94 0.045 150);--acc-ink:oklch(0.4 0.12 150);
 --gold:oklch(0.62 0.14 75);--gold-ink:oklch(0.5 0.12 70);--gold-soft:oklch(0.95 0.06 85);--line2:oklch(0.78 0.01 150);
 --warn:oklch(0.55 0.13 70);--warn-soft:oklch(0.95 0.06 85);
 --bad:oklch(0.5 0.19 25);--bad-soft:oklch(0.95 0.035 25);
 --p1:oklch(0.94 0.045 150);--p1i:oklch(0.4 0.12 150);
 --p2:oklch(0.94 0.035 250);--p2i:oklch(0.42 0.13 250);
 --p3:oklch(0.94 0.045 55);--p3i:oklch(0.47 0.13 50);
 --p4:oklch(0.94 0.04 300);--p4i:oklch(0.43 0.13 300);
 --p0:oklch(0.94 0.006 150);--p0i:oklch(0.4 0.01 150);
 --r:16px;--r-sm:11px;
 --tab-h:58px;--safe-b:env(safe-area-inset-bottom,0px);
 --ease:cubic-bezier(.22,1,.36,1);
 --z-sticky:10;--z-rest:20;--z-tab:30;--z-modal:40;--z-screen:50;--z-toast:60;
}
@media (prefers-color-scheme: dark){:root{
 --bg:oklch(0.165 0.008 150);--surf:oklch(0.215 0.01 150);--surf2:oklch(0.255 0.011 150);
 --ink:oklch(0.96 0.006 150);--mut:oklch(0.74 0.012 150);--line:oklch(0.31 0.01 150);
 --acc:oklch(0.79 0.17 150);--on-acc:oklch(0.18 0.03 150);--acc-soft:oklch(0.3 0.06 150);--acc-ink:oklch(0.84 0.14 150);
 --gold:oklch(0.83 0.14 85);--gold-ink:oklch(0.85 0.13 85);--gold-soft:oklch(0.32 0.06 85);--line2:oklch(0.48 0.012 150);
 --warn:oklch(0.82 0.14 80);--warn-soft:oklch(0.3 0.06 80);
 --bad:oklch(0.72 0.17 25);--bad-soft:oklch(0.29 0.06 25);
 --p1:oklch(0.29 0.06 150);--p1i:oklch(0.86 0.12 150);
 --p2:oklch(0.29 0.06 250);--p2i:oklch(0.85 0.09 250);
 --p3:oklch(0.3 0.06 55);--p3i:oklch(0.87 0.1 60);
 --p4:oklch(0.29 0.06 300);--p4i:oklch(0.86 0.09 300);
 --p0:oklch(0.27 0.01 150);--p0i:oklch(0.85 0.01 150);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0) 0 calc(var(--tab-h) + var(--safe-b) + 24px);overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto;padding:0 16px}
::placeholder{color:var(--mut);opacity:1}
.bt{font-size:15px;margin:0 0 8px;padding:0 4px;color:var(--mut);font-weight:600}
.card .bt{padding:0;color:var(--ink);font-size:16px}
.legend{font-size:13px;color:var(--mut);margin:-2px 4px 8px}
h1{font-size:30px;line-height:1.12;margin:0;letter-spacing:-0.02em;text-wrap:balance}
h2{font-size:21px;margin:0;letter-spacing:-0.01em}
h3{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
h4{font-size:15px;margin:16px 0 6px}
p{margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
svg{width:20px;height:20px;flex:none}
.muted{color:var(--mut)}.small{font-size:14px}
.top{padding:18px 4px 12px}
.sub{color:var(--mut);font-size:15px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px}
.p0{background:var(--p0);color:var(--p0i)}.p1{background:var(--p1);color:var(--p1i)}.p2{background:var(--p2);color:var(--p2i)}.p3{background:var(--p3);color:var(--p3i)}.p4{background:var(--p4);color:var(--p4i)}
.hint{color:var(--mut);font-size:15px;margin:10px 4px}
.empty{color:var(--mut);text-align:center;padding:40px 16px}
.link{color:var(--acc-ink);font-weight:600;display:inline-flex;align-items:center;gap:4px;min-height:44px}
.link svg{width:18px;height:18px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:600;font-size:17px;transition:transform .12s var(--ease),background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.sec{background:var(--surf2);color:var(--ink)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:11px}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:12px}
.actions .primary{flex:1}
.actions.wrap{flex-wrap:wrap}

/* сегменты */
.seg{display:flex;background:var(--surf2);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:15px;font-weight:500;color:var(--mut);padding:0 6px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / .12)}
.seg.small button{min-height:44px;font-size:14.5px}
.seg.big{margin:0 0 14px}

/* утро */
.morning{background:var(--surf);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.morning.l-green{background:var(--acc-soft);border-color:transparent}
.morning.l-yellow{background:var(--warn-soft);border-color:transparent}
.morning.l-red{background:var(--bad-soft);border-color:transparent}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:44px}
.mtxt{flex:1;display:flex;flex-direction:column}.mtxt span{font-size:14px;color:var(--mut)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.green{background:var(--acc)}.dot.yellow{background:var(--warn)}.dot.red{background:var(--bad)}
.mopts{display:flex;flex-direction:column;gap:2px}
.tgl{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15.5px}
.tgl input{width:22px;height:22px;accent-color:var(--acc)}
.pain{display:block;font-size:15px;margin:6px 0}
.pain input{width:100%;accent-color:var(--acc);height:44px}
.mq{margin:2px 0 2px;font-size:17px}
.mbtns{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:10px}
.mlab{font-size:14px;color:var(--mut);margin:6px 0 -4px}
.btn.wide{width:100%;margin-top:8px}
.lightbox{border-radius:12px;padding:10px 12px;font-size:15px;margin:8px 0 4px;background:var(--surf2)}
.lightbox.green{background:var(--acc-soft)}.lightbox.yellow{background:var(--warn-soft)}.lightbox.red{background:var(--bad-soft)}
.morning .lightbox{background:oklch(from var(--surf) l c h / .6)}

/* выбор дня */
.daypick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 6px}
.daypick button{background:var(--surf);border:1px solid var(--line);border-radius:13px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.daypick small{font-weight:500;color:var(--mut);font-size:12.5px}
.daypick small svg{width:13px;height:13px;vertical-align:-2px;margin-right:2px}
.daypick button.done small{color:var(--acc-ink)}
.pwd small{font-size:21px;font-weight:700}
.daypick button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-ink);border-color:var(--acc)}
.daypick button[aria-pressed="true"] small{color:inherit;opacity:.75}
.sesshead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 4px 4px}
.sesshead .muted{font-size:14px;white-space:nowrap}
.gatebox .link.inl{min-height:36px}
.gatebox{display:flex;gap:10px;background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px;margin:10px 0}
.gatebox svg{color:var(--warn);margin-top:2px}

/* блоки и пункты */
.blk{margin-top:18px}
.blk>h3{padding:0 4px}
.items{list-style:none;margin:0;padding:0;background:var(--surf);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.items>li+li{border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;min-height:56px}
.cbox{width:44px;height:44px;display:grid;place-items:center;flex:none}
.cbox svg{width:26px;height:26px;padding:4px;border-radius:50%;border:2px solid var(--line);color:transparent;transition:background .15s,border-color .15s,color .15s}
.chk.on .cbox svg{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.chk.locked .cname{color:var(--mut)}
.chk.locked .cbox svg{border:0;color:var(--mut)}
.cmain{flex:1;text-align:left;padding:9px 4px;display:flex;flex-direction:column;gap:1px;min-height:44px;justify-content:center}
.cname{font-weight:500}
.chk.on .cname{color:var(--mut)}
.dose{font-size:14.5px;color:var(--acc-ink);font-weight:600}
.cnote{font-size:13.5px;color:var(--mut)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;color:var(--acc-ink);border-radius:12px}
.ibtn svg{width:22px;height:22px}

/* силовые */
.gym .grow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;min-height:60px}
.gname{flex:1;font-weight:600;display:flex;flex-direction:column}
.gname small{font-weight:500;color:var(--mut);font-size:14px}
.gcount{display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--mut);background:var(--surf2);padding:4px 9px;border-radius:999px}
.gcount svg{width:15px;height:15px}
.gcount.ok{background:var(--acc-soft);color:var(--acc-ink)}
.gym.complete .gname{color:var(--mut)}
.gym.open{background:var(--surf)}
.gym.open .grow{padding-bottom:6px}
.gbody{padding:0 14px 14px}
.why{font-size:15px;background:var(--surf2);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.why summary{list-style:none;cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:baseline;font-weight:500}
.why summary::-webkit-details-marker{display:none}
.why .more{flex:none;font-size:13.5px;color:var(--acc-ink);font-weight:600}
.why[open] summary{margin-bottom:8px}
.why p:last-child{margin:0}
.why .muted{font-size:14px}
table.sets{width:100%;border-collapse:collapse;font-size:15.5px}
.sets th{font-size:12.5px;font-weight:600;color:var(--mut);text-align:left;padding:4px 6px}
.sets td{padding:9px 6px;border-top:1px solid var(--line)}
.sets td:first-child{width:34px;color:var(--mut);white-space:nowrap}
.sets tr.done{cursor:pointer}
.sets tr.done td b{color:var(--acc-ink)}
.pen{float:right;color:var(--mut);font-size:15px}
.sets .warmrow td{font-size:14px;color:var(--mut)}
.chip{display:inline-block;background:var(--surf2);border-radius:8px;padding:1px 7px;margin:2px 2px 0 0;color:var(--ink)}
.pr{color:var(--gold);display:inline-flex;vertical-align:-3px;margin-right:2px}
.pr svg{width:17px;height:17px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--surf2);border-radius:14px;padding:4px;position:relative}
.stepper .lbl{position:absolute;top:-19px;left:4px;font-size:12.5px;color:var(--mut)}
.stepper button{height:46px;border-radius:11px;font-size:24px;font-weight:500;background:var(--surf)}
.stepper button:active{transform:scale(.94)}
.stepper input{width:100%;min-width:0;text-align:center;border:0;background:none;font-size:22px;font-weight:700;height:46px}
.inputs{margin-top:28px}
.gfoot{display:flex;justify-content:space-between;margin-top:4px}

/* итог */
.summary{background:var(--surf);border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-top:18px}
.sumrow{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:16px}
.sumrow.gold{color:var(--gold-ink)}
.finish{background:var(--acc-soft);border-radius:var(--r);padding:14px 16px;margin-top:18px}
.finish .ftitle{font-size:20px;font-weight:700;margin:0 0 6px;color:var(--acc-ink)}.sumrow.gold span{flex:1;color:var(--ink)}
.meter{height:6px;border-radius:9px;background:var(--surf2);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:var(--acc);border-radius:9px}
.summary .btn{width:100%}
.notefield{display:block;margin:16px 4px 0;font-size:14px;color:var(--mut)}
.notefield textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line2);background:var(--surf);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink);resize:vertical}

/* таймер отдыха */
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + var(--safe-b) + 10px);max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px 12px;display:none;z-index:var(--z-rest);box-shadow:0 10px 30px oklch(0 0 0 / .25)}
#rest.on{display:block;animation:up .25s var(--ease)}
#rest.go{background:var(--acc);color:var(--on-acc);animation:pulse 1s ease-in-out infinite alternate}
.rtop{display:flex;align-items:center;gap:10px}
.rtime{font-size:30px;font-weight:700;min-width:78px;letter-spacing:-0.01em;line-height:1}
.rlbl{flex:1;font-size:15px;font-weight:600;line-height:1.2;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.resting{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 110px)}
.rbtn{min-width:44px;height:44px;border-radius:12px;background:oklch(from var(--bg) l c h / .14);font-weight:600;font-size:15px;padding:0 10px}
.rbar{height:4px;border-radius:9px;background:oklch(from var(--bg) l c h / .2);margin-top:8px;overflow:hidden}
.rbar i{display:block;height:100%;background:currentColor;opacity:.9;width:100%;transform:scaleX(0);transform-origin:left;transition:transform .25s linear}
#rest.go .rtime{font-size:40px}
#rest.go .rlbl{font-size:17px}
.rx{margin-left:6px}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{to{filter:brightness(1.12)}}

/* нижние вкладки */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-tab);display:flex;justify-content:space-around;padding:4px 4px calc(4px + var(--safe-b));background:oklch(from var(--surf) l c h / .95);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;font-size:12px;font-weight:500;color:var(--mut);max-width:110px}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--acc-ink)}

/* план */
.weeks{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.weeks::-webkit-scrollbar{display:none}
.weeks button{flex:none;min-width:46px;min-height:44px;padding:0 12px;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px}
.weeks button small{font-size:11.5px;color:var(--mut);font-weight:500}
.weeks button.wk.p0{background:var(--p0)}.weeks button.wk.p1{background:var(--p1)}.weeks button.wk.p2{background:var(--p2)}.weeks button.wk.p3{background:var(--p3)}.weeks button.wk.p4{background:var(--p4)}
.weeks button{border-color:transparent}
.weeks button.cur{border-color:var(--acc);border-width:2px}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks button[aria-pressed="true"] small{color:inherit;opacity:.75}
.phase{border-radius:var(--r);padding:16px;margin:4px 0 8px}
.phase h2{margin:2px 0 6px}
.phase.p0{color:var(--ink)}.phase.p1,.phase.p2,.phase.p3,.phase.p4{color:var(--ink)}
.phase .ptag{font-size:13px;font-weight:600;opacity:.8}
.phase .gate{font-size:15px;margin:10px 0 0;background:oklch(from var(--surf) l c h / .55);border-radius:12px;padding:10px 12px}
.phase .items{margin-top:10px}
.pday{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin:8px 0;overflow:hidden}
.pday summary{display:flex;align-items:center;gap:12px;padding:12px 14px;list-style:none;cursor:pointer;min-height:60px}
.pday summary::-webkit-details-marker{display:none}
.pday summary>svg,.rule summary>svg{color:var(--mut);transition:transform .2s var(--ease)}
.pday[open] summary>svg,.rule[open] summary>svg{transform:rotate(90deg)}
.pwd{width:34px;text-align:center;font-weight:700;font-size:13px;color:var(--mut);display:flex;flex-direction:column;line-height:1.1}
.pwd small{font-size:19px;color:var(--ink)}
.pname{flex:1;font-weight:600;display:flex;flex-direction:column}
.pname small{font-weight:500;color:var(--mut);font-size:14px}
.pbody{padding:0 14px 12px}
.pday.past{opacity:.85}
.pbody .ph{font-size:13px;color:var(--mut);margin:12px 0 2px;font-weight:600}
.pbody ul{list-style:none;margin:0;padding:0}
.pbody li{font-size:15px;min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.pbody li .link{min-height:44px;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pbody li.locked{opacity:.5}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h3{color:var(--ink);font-size:16px}
ul.plain{margin:6px 0;padding-left:20px}ul.plain li{margin:4px 0}

/* прогресс */
.prog{list-style:none;margin:0;padding:0;background:var(--surf);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.prog li+li{border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;min-height:58px}
.pn{flex:1;font-weight:600;display:flex;flex-direction:column;min-width:0}
.pn small{font-weight:500;color:var(--mut);font-size:14px}
.spark{width:64px;height:24px;color:var(--acc)}
.pd{font-size:14px;font-weight:700;min-width:46px;text-align:right;color:var(--mut)}
.pd.up{color:var(--acc-ink)}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px}
.chart .line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surf);stroke:var(--acc);stroke-width:2}
.chart .dpr{fill:var(--gold);stroke:var(--surf);stroke-width:1.5}
.chart .tline{stroke:var(--mut);stroke-dasharray:4 4}
.tests{list-style:none;margin:0;padding:0}
.test{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:8px 0}
.test.locked{opacity:.6}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.thead .link{color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tag{font-size:12.5px;font-weight:600;color:var(--mut);background:var(--surf2);border-radius:999px;padding:3px 9px;white-space:nowrap;display:inline-flex;align-items:center}
.tag.ok{background:var(--acc-soft);color:var(--acc-ink)}.tag.ok svg{width:16px;height:16px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tin{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.tin.two label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:2px}
.settings input[type=date]{width:auto;min-width:150px}
.tests.inner{padding:0 10px 4px}
.tin input,.settings input,.search{border:1px solid var(--line2);background:var(--surf2);border-radius:11px;height:44px;padding:0 12px;font-size:17px;width:110px;color:var(--ink)}
.tres{font-size:14px;margin:4px 0 2px;color:var(--mut)}
.tres.ok{color:var(--acc-ink)}.tres.bad{color:var(--bad)}
.rq{padding:10px 0;border-top:1px solid var(--line)}
.rq p{margin:0 0 4px;font-size:15.5px}.rq output{font-weight:700;color:var(--acc-ink)}
.rq input{width:100%;accent-color:var(--acc);height:32px}
.ran{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.rsitot{margin:12px 0;font-size:17px}

/* журнал */
.jweek{margin:18px 4px 8px}
.jlist{list-style:none;margin:0;padding:0;background:var(--surf);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.jlist li+li{border-top:1px solid var(--line)}
.jrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:60px}
.jd{width:34px;text-align:center;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;line-height:1.1;font-weight:600}
.jd b{font-size:19px;color:var(--ink)}
.jn{flex:1;font-weight:600;display:flex;flex-direction:column}
.jn small{font-weight:500;color:var(--mut);font-size:14px}
.jpr{display:inline-flex;align-items:center;gap:2px;color:var(--gold-ink);font-weight:700;font-size:14px}
.jpr svg{width:17px;height:17px}
.jbody{padding:0 14px 12px}
.jbody pre{white-space:pre-wrap;font:inherit;font-size:15px;background:var(--surf2);border-radius:12px;padding:10px 12px;margin:0}

/* ещё */
.menu,.lib{list-style:none;margin:0;padding:0;background:var(--surf);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.menu li+li,.lib li+li{border-top:1px solid var(--line)}
.menu button,.lib button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:52px}
.menu svg{color:var(--acc-ink)}
.lib img,.noimg{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--surf2);flex:none}
.search{width:100%;margin-bottom:10px}
.rule{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin:8px 0;overflow:hidden}
.rule summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;min-height:52px;font-weight:600;list-style:none;cursor:pointer}
.rule summary::-webkit-details-marker{display:none}
.rule summary .muted{font-weight:500;margin-left:auto}
.rule>div{padding:0 14px 12px;font-size:15.5px}
.rule .lib{border:0;border-radius:0;border-top:1px solid var(--line)}
.settings{padding:4px 14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow>span:first-child{display:flex;flex-direction:column;font-size:16px}
.srow small{color:var(--mut);font-size:13px}
.srow.col{flex-direction:column;align-items:flex-start}
.srow .two{display:flex;align-items:center;gap:6px}.srow .two input{width:64px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;inset:-8px -4px}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px oklch(0 0 0 / .3);transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--acc)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.foot{font-size:13.5px;color:var(--mut);margin:24px 4px}

/* лист снизу */
.modal{position:fixed;inset:0;background:oklch(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:var(--z-modal);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 6px}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(24px + var(--safe-b));transform:translateY(24px);transition:transform .25s var(--ease)}
.modal.on .sheet{transform:none}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:1}
.shead h3{color:var(--ink);font-size:20px;margin:6px 0 0}
.vid{position:relative;display:block;border-radius:14px;overflow:hidden;background:var(--surf2);aspect-ratio:16/9;margin:4px 0 12px}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vplay{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:oklch(0 0 0 / .62);display:grid;place-items:center;color:#fff}
.vplay svg{width:28px;height:28px;margin-left:3px}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vlink{margin:-4px 0 12px;font-size:14.5px}.vlink a{color:var(--acc-ink);font-weight:600}
.novid{font-size:14.5px;color:var(--mut);background:var(--surf2);border-radius:12px;padding:10px 12px;margin:4px 0 12px}
.vmark{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--acc-ink);margin-top:1px}.vmark svg{width:14px;height:14px}
.vch{position:absolute;left:8px;bottom:8px;background:oklch(0 0 0 / .62);color:#fff;font-size:12.5px;padding:3px 8px;border-radius:7px}
.steps{padding-left:22px;margin:4px 0}
.steps li{margin:6px 0;padding-left:2px}
.steps li::marker{font-weight:700;color:var(--acc-ink)}
.tip{background:var(--surf2);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}

/* полноэкранный таймер */
#screen{position:fixed;inset:0;z-index:var(--z-screen);background:oklch(0.16 0.01 150);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#screen.on{display:flex}
.slbl{font-size:20px;opacity:.8}
.sbig{font-size:52px;font-weight:800;margin:6px 0}
.scnt{font-size:84px;font-weight:800;letter-spacing:-0.02em}
.arrow{font-size:min(55vw,320px);line-height:1;font-weight:800;margin:0}
.arrow.feint{color:oklch(0.85 0.16 85)}.arrow.dim{opacity:.2}
.sstop{position:absolute;bottom:calc(30px + var(--safe-b));min-width:160px}
.sbtns{position:absolute;bottom:calc(30px + var(--safe-b));left:16px;right:16px;display:flex;gap:10px;justify-content:center}
.sbtns .btn{flex:1;max-width:160px}
.sheet .btn.primary{width:100%;margin-top:12px}

/* уведомление */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:15px;z-index:var(--z-toast);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s var(--ease)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
body.resting #toast{bottom:calc(var(--tab-h) + var(--safe-b) + 96px)}
.tbtn{color:var(--acc);font-weight:700;min-height:44px;padding:0 4px}
#toast.gold{background:var(--gold-soft);color:var(--ink)}
#toast.gold .tbtn{color:var(--acc-ink)}
@media (prefers-color-scheme: dark){.tbtn{color:oklch(0.5 0.15 150)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){body{font-size:16px}}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest" role="timer" aria-live="off">
 <div class="rtop"><span class="rtime">0:00</span><span class="rlbl"></span><button class="rbtn" data-act="rest-add" data-d="-15" aria-label="Минус 15 секунд">−15</button><button class="rbtn" data-act="rest-add" data-d="15" aria-label="Плюс 15 секунд">+15</button><button class="rbtn rx" data-act="rest-skip" aria-label="Закрыть таймер">✕</button></div>
 <div class="rbar"><i></i></div>
</div>
<nav class="tabbar" aria-label="Разделы">
 <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h2.5v10H6zM15.5 7H18v10h-2.5zM8.5 11h7v2h-7z" fill="currentColor"/></svg>Сегодня</button>
 <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>План</button>
 <button data-tab="prog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Прогресс</button>
 <button data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a1.5 1.5 0 0 1 1.5 1.5v14A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-14A1.5 1.5 0 0 1 6 4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Журнал</button>
 <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/></svg>Ещё</button>
</nav>
<div class="modal" id="modal" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="screen" role="dialog" aria-live="assertive"></div>
<div id="toast" role="status"></div>
<script src="data.js?v=6"></script>
<script src="videos.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
